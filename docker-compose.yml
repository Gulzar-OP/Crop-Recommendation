services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile.ml
    environment:
      ML_INTERNAL_API_KEY: ${ML_INTERNAL_API_KEY:-development-ml-key}
    ports:
      - "8001:8001"

  backend:
    build: ./backend
    depends_on:
      - mongodb
      - ml-service
    environment:
      PORT: 8000
      NODE_ENV: development
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET:-replace-this-before-production}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL}
      ML_SERVICE_URL: ${ML_SERVICE_URL}
      ML_INTERNAL_API_KEY: ${ML_INTERNAL_API_KEY:-development-ml-key}
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mongo_data: